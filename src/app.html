<title>Meta 50</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: app de uma coluna (max 560px), cabeçalho simples, conteúdo em cartões, barra de navegação fixa embaixo com botão central "+" para registrar. */
:root{
  --bg:#edf0ee; --surface:#ffffff; --surface2:#f4f6f5; --ink:#0d1b17; --muted:#5a6b65; --line:#d9e0dc;
  --hit:#13804f; --over:#6d4fd6; --below:#4f7389; --a99:#d98a00; --aifood:#d6364b; --accent:#13804f; --on-accent:#ffffff; --seg-on:#ffffff;
  --shadow:0 1px 2px rgba(13,27,23,.06),0 6px 20px rgba(13,27,23,.06);
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a110f; --surface:#121c19; --surface2:#182420; --ink:#e7f0ec; --muted:#8ea39b; --line:#243630;
  --hit:#3fd68f; --over:#b39dff; --below:#7fa6bd; --a99:#f5a524; --aifood:#ff6a7c; --accent:#3fd68f; --on-accent:#04140d; --seg-on:#2c4339;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a110f; --surface:#121c19; --surface2:#182420; --ink:#e7f0ec; --muted:#8ea39b; --line:#243630;
  --hit:#3fd68f; --over:#b39dff; --below:#7fa6bd; --a99:#f5a524; --aifood:#ff6a7c; --accent:#3fd68f; --on-accent:#04140d; --seg-on:#2c4339;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
html.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
.ic{width:22px;height:22px;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.top h1{margin:0;font:700 26px/1.1 var(--f-display);letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.streak{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.streak .ic{width:18px;height:18px;color:var(--a99)}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:700 17px/1.2 var(--f-display)}
.card h2 small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.muted{color:var(--muted)}
small,.small{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip-hit{background:color-mix(in srgb,var(--hit) 18%,var(--surface));color:var(--hit)}
.chip-over{background:color-mix(in srgb,var(--over) 18%,var(--surface));color:var(--over)}
.chip-below{background:color-mix(in srgb,var(--below) 18%,var(--surface));color:var(--below)}
.big{font:800 52px/1 var(--f-display);letter-spacing:-.03em}
.hero.st-hit .big{color:var(--hit)} .hero.st-over .big{color:var(--over)}
.bar{position:relative;height:22px;border-radius:99px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .f1{background:var(--hit)} .bar .f2{background:var(--over)}
.bar .tick{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--surface)}
.bar.thin{height:10px}
.bar .s99{background:var(--a99)} .bar .sif{background:var(--aifood)}
.bar .sdia{background:var(--a99)} .bar .snoite{background:var(--below)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio>div{background:var(--surface2);border-radius:14px;padding:10px;min-width:0}
.trio small{display:block}
.trio b{font:700 17px/1.3 var(--f-display);white-space:nowrap}
.msg{margin:0;font-size:17px;font-weight:600}
.btn{border:0;border-radius:16px;min-height:48px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.xl{min-height:60px;font-size:18px;border-radius:18px}
.btn.danger{background:color-mix(in srgb,var(--aifood) 16%,var(--surface));color:var(--aifood);border-color:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.5}
.kv{display:flex;flex-direction:column;gap:10px}
.split{display:flex;flex-direction:column;gap:8px}
.split .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.split .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.dot.a99,.dot.d{background:var(--a99)} .dot.ifood{background:var(--aifood)} .dot.n{background:var(--below)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:420px){.grid2.stackm{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0}
.stat b{font:700 22px/1.15 var(--f-display);overflow-wrap:anywhere}
.stat small{font-size:13px}
.note{font-size:14px;color:var(--muted);margin:0}
.plan input.mini{width:96px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 10px;text-align:right}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(12px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.nav button.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);min-height:52px;border-radius:12px}
.nav button.tab[aria-current="page"]{color:var(--accent)}
.fab{width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab .ic{width:30px;height:30px;stroke-width:2.6}
/* seg */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg>*{flex:1;min-width:0}
.seg button,.seg label span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:10px;border:0;background:none;font-weight:600;font-size:15px;width:100%;color:var(--muted);text-align:center;padding:0 6px}
.seg button[aria-pressed="true"],.seg input:checked+span{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg label{display:block;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:focus-visible+span{outline:3px solid var(--accent)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0}
.cell{position:relative;aspect-ratio:.82;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 4px;min-width:0;overflow:hidden}
.cell .dn{font-size:12px;font-weight:600;color:var(--muted);line-height:1}
.cell .cv{font:700 13px/1 var(--f-display)}
.cell .cc{font-size:10px;color:var(--muted);line-height:1;min-height:10px}
.cell .mk{position:absolute;top:3px;right:3px}.cell .mk .ic{width:11px;height:11px;stroke-width:3}
.cell.st-hit{background:color-mix(in srgb,var(--hit) 20%,var(--surface));border-color:color-mix(in srgb,var(--hit) 55%,var(--line))}
.cell.st-hit .mk{color:var(--hit)}
.cell.st-over{background:color-mix(in srgb,var(--over) 22%,var(--surface));border-color:color-mix(in srgb,var(--over) 60%,var(--line))}
.cell.st-over .mk{color:var(--over)}
.cell.st-below{background:color-mix(in srgb,var(--below) 14%,var(--surface));border-color:color-mix(in srgb,var(--below) 45%,var(--line))}
.cell.st-none{background:transparent;border-style:dashed}
.cell.future{opacity:.4}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block;border:1px solid var(--line)}
.legend .l-hit{background:color-mix(in srgb,var(--hit) 30%,var(--surface))} .legend .l-over{background:color-mix(in srgb,var(--over) 30%,var(--surface))}
.legend .l-below{background:color-mix(in srgb,var(--below) 25%,var(--surface))} .legend .l-none{border-style:dashed}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{margin:0;font:700 20px var(--f-display);text-align:center;flex:1}
.wrow{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);text-align:left;width:100%}
.wrow .d{font:700 15px var(--f-display);line-height:1.15} .wrow .d small{display:block;font:500 12px var(--f-body)}
.wrow .v{font:700 17px var(--f-display)}
.wrow.today{outline:2px solid var(--ink)}
/* lists */
ul.ents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ent{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:16px;padding:10px 8px 10px 12px;min-width:0}
.ent .em{flex:1;min-width:0}
.ent .em b{font:700 18px/1.2 var(--f-display)}
.ent .em small{display:block;overflow-wrap:anywhere}
.ent .iconbtn{width:42px;height:42px;border-radius:12px;background:transparent;border-color:transparent}
.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;font-size:15px}
/* charts */
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--f-body)}
.chart .goal{stroke:var(--accent);stroke-dasharray:4 3;stroke-width:1.2}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text.vl{fill:var(--ink);font-weight:600}
.chart text.gl{fill:var(--accent);font-weight:700}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,10,8,.55)}
.sheet{width:100%;max-width:560px;max-height:94dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font:700 21px/1.15 var(--f-display)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lb{font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%;min-width:0}
.inp.money{height:64px;font:800 32px var(--f-display);text-align:left}
.inp.area{height:96px;padding:10px 14px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:40px;padding:0 14px;font-weight:600}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 24px var(--f-display)}
.stepper input{width:70px;text-align:center;font:700 22px var(--f-display);height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.err{color:var(--aifood);font-weight:600;font-size:14px;min-height:0;margin:0}
.hide-count .count-row{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600;font-size:15px}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;min-height:36px;padding:0 4px;filter:brightness(1.2)}
.banner{background:color-mix(in srgb,var(--a99) 18%,var(--surface));border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.badge-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.badge-list{grid-template-columns:1fr}}
.badge{border-radius:18px;padding:12px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.badge.off{opacity:.62;box-shadow:none;border:1px dashed var(--line);background:transparent}
.badge .t{display:flex;align-items:center;gap:8px;font-weight:700}
.badge .t .ic{width:20px;height:20px;color:var(--over)}
.badge.off .t .ic{color:var(--muted)}
textarea.code{width:100%;height:110px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.daychips{display:flex;gap:8px;flex-wrap:wrap}
.wkdays{display:flex;gap:6px;flex-wrap:wrap}
.wkdays button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.wkdays button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main" class="app-main" style="display:flex;flex-direction:column;gap:14px"></main>
</div>
<nav class="nav" aria-label="Navegação principal"><div class="nav-in" id="nav"></div></nav>

function sanitizeSettings(s){
  s=s||{}; var o=clone(DEF.settings);
  o.daily=posInt(s.daily,o.daily,9999999); o.weekly=posInt(s.weekly,o.weekly,99999999); o.monthly=posInt(s.monthly,o.monthly,999999999); o.avg=posInt(s.avg,o.avg,9999999);
  if(Array.isArray(s.workDays))o.workDays=s.workDays.filter(function(x){return Number.isInteger(x)&&x>=0&&x<=6});
  if(['auto','light','dark'].indexOf(s.theme)>=0)o.theme=s.theme;
  if(s.lastApp==='99'||s.lastApp==='ifood')o.lastApp=s.lastApp;
  if(typeof s.lastBackup==='string')o.lastBackup=s.lastBackup;
  return o;
}
function sanitizeEntry(e){
  if(!e||typeof e!=='object')return null;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date))return null;
  if(e.app!=='99'&&e.app!=='ifood')return null;
  var v=Math.round(Number(e.value)); if(!isFinite(v)||v<=0||v>99999999)return null;
  var per=e.period==='noite'?'noite':'dia';
  var c=Math.round(Number(e.count)); if(!isFinite(c)||c<0)c=0; if(c>999)c=999;
  return {id:String(e.id||uid()),date:e.date,app:e.app,value:v,period:per,count:c,note:String(e.note||'').slice(0,200),created:Number(e.created)||Date.now(),demo:!!e.demo};
}
function load(){
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){canPersist=false;return}
  try{
    var raw=localStorage.getItem(KEY); if(!raw)return;
    var o=JSON.parse(raw);
    state={settings:sanitizeSettings(o.settings),entries:(o.entries||[]).map(sanitizeEntry).filter(Boolean)}; S=state.settings;
  }catch(e){toast('Não consegui ler os dados salvos. Faça backup se puder.')}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));canPersist=true}catch(e){canPersist=false;toast('Não foi possível salvar neste navegador.')}
}
var IDX=new Map();
function emptyDay(s){return {date:s,total:0,count:0,app:{'99':0,ifood:0},per:{dia:0,noite:0},appCnt:{'99':0,ifood:0},appVal:{'99':0,ifood:0},entries:[]}}
function reindex(){
  IDX=new Map();
  state.entries.forEach(function(e){
    var d=IDX.get(e.date); if(!d){d=emptyDay(e.date);IDX.set(e.date,d)}
    d.total+=e.value; d.count+=e.count; d.app[e.app]+=e.value; d.per[e.period]+=e.value;
    if(e.count>0){d.appCnt[e.app]+=e.count;d.appVal[e.app]+=e.value}
    d.entries.push(e);
  });
}
function day(s){return IDX.get(s)||emptyDay(s)}
function status(d){ if(!d.entries.length)return 'none'; var g=S.daily; return d.total>g?'over':d.total>=g?'hit':'below' }
var STL={over:'Meta superada',hit:'Meta atingida',below:'Abaixo da meta',none:'Sem registros'};
function rangeDates(a,b){var r=[],s=a;while(s<=b){r.push(s);s=addDays(s,1)}return r}
function monthDates(y,m){return rangeDates(ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0)))}
function agg(dates){
  var t=TODAY(),o={total:0,count:0,days:0,hit:0,over:0,below:0,app:{'99':0,ifood:0},per:{dia:0,noite:0},appCnt:{'99':0,ifood:0},appVal:{'99':0,ifood:0},valSum:0,cntSum:0};
  dates.forEach(function(s){
    if(s>t)return; var d=IDX.get(s); if(!d)return;
    o.total+=d.total;o.count+=d.count;o.days++;
    var st=status(d); if(st==='below')o.below++; else{o.hit++; if(st==='over')o.over++}
    ['99','ifood'].forEach(function(a){o.app[a]+=d.app[a];o.appCnt[a]+=d.appCnt[a];o.appVal[a]+=d.appVal[a]});
    o.per.dia+=d.per.dia;o.per.noite+=d.per.noite;
  });
  o.valSum=o.appVal['99']+o.appVal.ifood; o.cntSum=o.appCnt['99']+o.appCnt.ifood;
  return o;
}
function bestPeriod(d){ if(d.per.dia>0&&d.per.noite>0) return d.per.dia>d.per.noite?'Dia':d.per.noite>d.per.dia?'Noite':'Empate'; return null }
function streaks(){
  var dates=Array.from(IDX.keys()).sort(); if(!dates.length)return {cur:0,best:0};
  var t=TODAY(),run=0,best=0;
  for(var s=dates[0];s<=t;s=addDays(s,1)){
    var d=IDX.get(s),hit=!!d&&d.total>=S.daily;
    if(hit){run++;if(run>best)best=run}
    else if(s===t){}
    else if(S.workDays.indexOf(pd(s).getDay())<0){}
    else run=0;
  }
  return {cur:run,best:best};
}
function allStats(){
  var tot={hits:0,over:0,bestDay:null,weeks:{},months:{}};
  IDX.forEach(function(d,s){
    if(d.total>=S.daily)tot.hits++; if(d.total>S.daily)tot.over++;
    if(!tot.bestDay||d.total>tot.bestDay.total)tot.bestDay=d;
    var w=weekStart(s);tot.weeks[w]=(tot.weeks[w]||0)+d.total;
    var m=s.slice(0,7);tot.months[m]=(tot.months[m]||0)+d.total;
  });
  function mx(o){var k=null;for(var x in o)if(k===null||o[x]>o[k])k=x;return k===null?null:{key:k,total:o[k]}}
  tot.bestWeek=mx(tot.weeks);tot.bestMonth=mx(tot.months);
  tot.weekHit=Object.keys(tot.weeks).some(function(k){return tot.weeks[k]>=S.weekly});
  tot.monthHit=Object.keys(tot.months).some(function(k){return tot.months[k]>=S.monthly});
  return tot;
}

/* ---------- componentes ---------- */
function bar(total,goal){
  var max=Math.max(total,goal,1),g=goal/max*100,f1=Math.min(total,goal)/max*100,f2=Math.max(0,total-goal)/max*100;
  return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+goal+'" aria-valuenow="'+Math.min(total,goal)+'" aria-label="Progresso da meta"><i class="f1" style="width:'+f1.toFixed(1)+'%"></i>'+
    (total>goal?'<i class="f2" style="left:'+g.toFixed(1)+'%;width:'+f2.toFixed(1)+'%"></i><b class="tick" style="left:'+g.toFixed(1)+'%"></b>':'')+'</div>';
}
function msgFor(total,goal){
  var rem=Math.max(0,goal-total),pct=Math.floor(total/goal*100);
  if(total<=0)return 'Comece sua jornada. Cada entrega conta.';
  if(total>goal)return 'Meta superada! Você fez '+money(total-goal)+' a mais.';
  if(total===goal)return 'Meta diária atingida! Você garantiu seu objetivo de hoje.';
  if(pct>=60)return 'Boa! Você já fez a maior parte. Faltam só '+money(rem)+'.';
  return 'Você já conquistou '+pct+'% da meta. Faltam '+money(rem)+'.';
}
function appName(a){return a==='99'?'99':'iFood'}
function entryRow(e){
  var bits=[appName(e.app),e.period==='dia'?'Dia':'Noite'];
  if(e.count>0)bits.push(e.count+' '+plural(e.count,'entrega','entregas'));
  if(e.note)bits.push(esc(e.note));
  return '<li class="ent"><span class="dot '+e.app+'"></span><div class="em"><b>'+money(e.value)+'</b><small>'+bits.join(' · ')+(e.demo?' · exemplo':'')+'</small></div>'+
   '<button class="iconbtn" data-act="edit" data-id="'+e.id+'" aria-label="Editar registro de '+money(e.value)+'">'+ic('edit')+'</button>'+
   '<button class="iconbtn" data-act="del" data-id="'+e.id+'" aria-label="Excluir registro de '+money(e.value)+'">'+ic('trash')+'</button></li>';
}
function entriesList(s){
  var d=day(s); if(!d.entries.length)return '<div class="empty">Nenhum registro neste dia.</div>';
  return '<ul class="ents">'+d.entries.slice().sort(function(a,b){return b.created-a.created}).map(entryRow).join('')+'</ul>';
}
function splitBar(parts){ // parts:[{v,cls}]
  var t=parts.reduce(function(a,p){return a+p.v},0);
  return '<div class="bar thin" aria-hidden="true">'+(t>0?parts.map(function(p,i){var left=parts.slice(0,i).reduce(function(a,q){return a+q.v},0)/t*100;return '<i class="'+p.cls+'" style="left:'+left.toFixed(1)+'%;width:'+(p.v/t*100).toFixed(1)+'%"></i>'}).join(''):'')+'</div>';
}

/* gráfico de barras (empilhadas) em SVG, escala única */
function chart(cats,o){
  o=o||{}; var W=340,H=o.h||170,L=38,R=6,T=14,B=22,pw=W-L-R,ph=H-T-B;
  var goal=o.goal||0,mx=Math.max(goal,1000);
  cats.forEach(function(c){var s=c.segs.reduce(function(a,x){return a+x.v},0);if(s>mx)mx=s});
  var top=Math.ceil(mx*1.12/1000)*1000;
  var y=function(v){return T+ph-(v/top)*ph};
  var n=cats.length,step=pw/n,bw=Math.max(2,Math.min(30,step*0.7));
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Gráfico')+'">';
  var ticks=[0]; if(goal)ticks.push(goal); if(!goal||top-goal>top*0.12)ticks.push(top);
  ticks.forEach(function(v){
    out+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/>';
    out+='<text x="'+(L-5)+'" y="'+(y(v)+3)+'" text-anchor="end"'+(v===goal&&goal?' class="gl"':'')+'>'+short(v)+'</text>';
  });
  if(goal)out+='<line class="goal" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(goal)+'" y2="'+y(goal)+'"/>';
  var k=Math.ceil(n/(n>16?8:n));
  cats.forEach(function(c,i){
    var cx=L+step*i+step/2,base=0,tot=0;
    c.segs.forEach(function(s){
      if(s.v<=0)return;
      var h=s.v/top*ph; out+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+y(base+s.v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+s.c+'" stroke="var(--surface)" stroke-width="1"/>';
      base+=s.v;tot+=s.v;
    });
    if(o.values&&n<=8&&tot>0)out+='<text class="vl" x="'+cx.toFixed(1)+'" y="'+(y(tot)-3).toFixed(1)+'" text-anchor="middle">'+Math.round(tot/100)+'</text>';
    if(i%k===0)out+='<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(c.label)+'</text>';
  });
  return out+'</svg>';
}
function legend(items){return '<div class="legend">'+items.map(function(i){return '<span><i style="background:'+i.c+'"></i>'+i.t+'</span>'}).join('')+'</div>'}

function bar2(v,g){var p=Math.min(100,v/g*100);return '<div class="bar thin" role="progressbar" aria-valuenow="'+Math.min(v,g)+'" aria-valuemax="'+g+'"><i class="'+(v>=g?'f1':'f1')+'" style="width:'+p.toFixed(1)+'%"></i></div>'}
function realAvg(){
  var t=TODAY(),a=agg(rangeDates(addDays(t,-29),t)); return a.cntSum>=5?Math.round(a.valSum/a.cntSum):0;
}
function planCard(tot){
  var rem=Math.max(0,S.daily-tot),avg=S.avg,ra=realAvg(),h='<section class="card plan"><h2>Plano para bater a meta</h2>';

function appCard(a,x,main){

  if(mode==='one'&&!e0)cnt=1;else{cnt=Number(el.fc.value||0);if(!Number.isInteger(cnt)||cnt<0||cnt>99)return bad('Entregas deve ser um número inteiro de 0 a 99.','#fc')}
  var rec={date:date,app:el.fapp.value,value:v,period:el.fper.value,count:cnt,note:el.fn.value.trim().slice(0,200)};
  if(e0){var cur=state.entries.find(function(x){return x.id===e0});if(cur)Object.assign(cur,rec)}
  else state.entries.push(Object.assign({id:uid(),created:Date.now(),demo:false},rec));
  S.lastApp=rec.app;save();reindex();
  var back=ui.sheet.from==='day'?{type:'day',date:date}:null;
  if(again){
    toast('Salvo: '+money(v)+' · '+appName(rec.app)); render();
    el.fv.value='';el.fn.value='';err.textContent='';renderRecents();el.fv.focus();return true;
  }
  ui.sheet=back;render();toast('Salvo: '+money(v)+' · '+appName(rec.app)+' · '+(rec.period==='dia'?'Dia':'Noite'));return true;
}
function renderRecents(){/* os chips recentes são atualizados na próxima abertura */}

/* ---------- backup ---------- */
function backupObj(){return {app:'meta50',version:1,exportedAt:new Date().toISOString(),note:'Valores em centavos de real.',settings:state.settings,entries:state.entries}}
function download(name,mime,text){
  try{var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){}
}
function markBackup(){S.lastBackup=TODAY();save()}
function toCSV(){
  var rows=['data;aplicativo;periodo;valor;entregas;observacao'];
  state.entries.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.created-b.created}).forEach(function(e){
    rows.push([fmtDate(e.date),appName(e.app),e.period,fmtInput(e.value),e.count,'"'+String(e.note).replace(/"/g,'""')+'"'].join(';'));
  });
  return '﻿'+rows.join('\r\n');
}
function parseBackup(text){
  var o;try{o=JSON.parse(text)}catch(e){throw new Error('O arquivo não é um JSON válido.')}
  if(!o||o.app!=='meta50'||!Array.isArray(o.entries))throw new Error('Este arquivo não parece ser um backup do Meta 50.');
  var ents=o.entries.map(sanitizeEntry).filter(Boolean);
  var have={};state.entries.forEach(function(e){have[e.id]=1});
  return {entries:ents,settings:o.settings?sanitizeSettings(o.settings):null,fresh:ents.filter(function(e){return !have[e.id]}).length};
}
function handleImportText(t){
  try{ui.pendingImport=parseBackup(t);render()}catch(e){ui.pendingImport=null;toast(e.message)}
}
/* ---------- exemplos ---------- */
function loadDemo(){
  var t=TODAY(),seed=7,rnd=function(){seed=(seed*9301+49297)%233280;return seed/233280};
  for(var i=1;i<=28;i++){
    var s=addDays(t,-i),dow=pd(s).getDay();
    if(dow===0&&rnd()<.7)continue; if(rnd()<.12)continue;
    var target=3400+Math.round(rnd()*3600),got=0,k=0;
    while(got<target&&k<9){
      var val=450+Math.round(rnd()*650),app=rnd()<.72?'99':'ifood',per=(got<target*.55)?'dia':'noite';
      if(rnd()<.35){var n=2+Math.floor(rnd()*3);val=val*n;state.entries.push({id:uid(),date:s,app:app,value:val,period:per,count:n,note:'total do período',created:Date.now()+k+i*20,demo:true})}
      else state.entries.push({id:uid(),date:s,app:app,value:val,period:per,count:1,note:'',created:Date.now()+k+i*20,demo:true});
      got+=val;k++;
    }
  }
  state.entries.push({id:uid(),date:t,app:'99',value:1900,period:'dia',count:3,note:'exemplo de hoje',created:Date.now(),demo:true});
  state.entries.push({id:uid(),date:t,app:'ifood',value:1300,period:'dia',count:2,note:'',created:Date.now()+1,demo:true});
  save();reindex();render();toast('Exemplos carregados. Remova quando quiser em Ajustes.');
}

/* ---------- render ---------- */
var VIEWS={hoje:vHoje,cal:vCal,apps:vApps,rel:vRel,cfg:vCfg};
function render(){
  reindex();applyTheme();
  var t=TODAY(),top='';
  if(ui.tab==='hoje'){var d=pd(t);top='<div><div class="eyebrow">'+WDL[d.getDay()]+'</div><h1>'+fmtDate(t)+'</h1></div>'}
  else top='<div><div class="eyebrow">Meta '+money(S.daily)+' por dia</div><h1>'+TITLES[ui.tab]+'</h1></div>';
  var st=streaks();
  top+='<div class="top-r"><span class="streak" title="Dias seguidos com a meta atingida" aria-label="Sequência de '+st.cur+' dias">'+ic('flame')+st.cur+'</span><button class="iconbtn" data-act="tab" data-v="cfg" aria-label="Ajustes"'+(ui.tab==='cfg'?' aria-current="page"':'')+'>'+ic('gear')+'</button></div>';
  $('#top').innerHTML=top;
  $('#main').innerHTML=VIEWS[ui.tab]();
  var tabs=[['hoje','Hoje','home'],['cal','Calendário','cal'],['+'],['apps','Apps','apps'],['rel','Relatórios','chart']];
  $('#nav').innerHTML=tabs.map(function(x){return x[0]==='+'?'<button class="fab" data-act="add" aria-label="Registrar ganho">'+ic('plus')+'</button>':'<button class="tab" data-act="tab" data-v="'+x[0]+'"'+(ui.tab===x[0]?' aria-current="page"':'')+'>'+ic(x[2])+x[1]+'</button>'}).join('');
  if(!ui.sheet||ui.sheet.type==='day')renderSheet();
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el){ if(ev.target.id==='sheetwrap'){ui.sheet&&ui.sheet.type==='form'&&ui.sheet.from==='day'?openSheet({type:'day',date:ui.sheet.date}):closeSheet()} return }
  var a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case 'tab':ui.tab=v;ui.sheet=null;renderSheet();render();window.scrollTo(0,0);break;
    case 'add':openSheet({type:'form',date:TODAY()});break;
    case 'addday':openSheet({type:'form',date:el.dataset.date,from:'day'});break;
    case 'day':openSheet({type:'day',date:el.dataset.date});break;
    case 'edit':openSheet({type:'form',id:id,from:ui.sheet&&ui.sheet.type==='day'?'day':null,date:ui.sheet&&ui.sheet.date});break;
    case 'del':{var i=state.entries.findIndex(function(e){return e.id===id});if(i>=0){ui.lastDeleted=state.entries.splice(i,1)[0];save();render();toast('Registro excluído.',true)}break}
    case 'undo':if(ui.lastDeleted){state.entries.push(ui.lastDeleted);ui.lastDeleted=null;save();render();$('#toast').hidden=true;toast('Registro restaurado.')}break;
    case 'closesheet':closeSheet();break;
    case 'closeform':ui.sheet&&ui.sheet.from==='day'?openSheet({type:'day',date:ui.sheet.date}):closeSheet();break;
    case 'fillv':$('#fv').value=fmtInput(Number(v));$('#fv').focus();break;
    case 'cnt':{var c=$('#fc');c.value=Math.max(0,Math.min(99,(parseInt(c.value,10)||0)+Number(v)));break}
    case 'calprev':ui.calM--;if(ui.calM<0){ui.calM=11;ui.calY--}render();break;
    case 'calnext':ui.calM++;if(ui.calM>11){ui.calM=0;ui.calY++}render();break;
    case 'caltoday':{var n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();render();break}
    case 'calmode':ui.calMode=v;render();break;
    case 'wkprev':ui.weekRef=addDays(ui.weekRef,-7);render();break;
    case 'wknext':ui.weekRef=addDays(ui.weekRef,7);render();break;
    case 'wktoday':ui.weekRef=TODAY();render();break;
    case 'apprange':ui.appsRange=v;render();break;
    case 'reptab':ui.repTab=v;render();break;
    case 'reprange':ui.repRange=v;ui.repOff=0;render();break;
    case 'repprev':ui.repOff--;render();break;
    case 'repnext':if(ui.repOff<0){ui.repOff++;render()}break;
    case 'use-avg':S.avg=Number(v);save();render();toast('Média atualizada para '+money(S.avg)+'.');break;
    case 'wkday':{var k=Number(v),ix=S.workDays.indexOf(k);if(ix>=0)S.workDays.splice(ix,1);else S.workDays.push(k);save();render();break}
    case 'theme':S.theme=v;save();render();break;
    case 'demo-load':loadDemo();break;
    case 'demo-remove':state.entries=state.entries.filter(function(e){return !e.demo});save();render();toast('Exemplos removidos.');break;
    case 'exp-json':{var tx=JSON.stringify(backupObj(),null,1);ui.exportText=tx;download('meta50-backup-'+TODAY()+'.json','application/json',tx);markBackup();render();toast('Backup gerado.');break}
    case 'exp-csv':{var cv=toCSV();download('meta50-registros-'+TODAY()+'.csv','text/csv;charset=utf-8',cv);toast('CSV gerado.');break}
    case 'exp-copy':{var tx2=JSON.stringify(backupObj());ui.exportText=tx2;markBackup();render();
      try{navigator.clipboard.writeText(tx2).then(function(){toast('Backup copiado.')},function(){toast('Não consegui copiar. Selecione o texto abaixo.')})}catch(e){toast('Selecione e copie o texto abaixo.')}break}
    case 'imp-paste':handleImportText(($('#imptext')||{}).value||'');break;
    case 'imp-merge':case 'imp-replace':{
      var p=ui.pendingImport;if(!p)break;
      if(a==='imp-replace'){state.entries=p.entries.slice();if(p.settings){state.settings=p.settings;S=state.settings}}
      else{var have={};state.entries.forEach(function(e){have[e.id]=1});p.entries.forEach(function(e){if(!have[e.id])state.entries.push(e)})}
      ui.pendingImport=null;save();render();toast('Backup importado.');break}
    case 'imp-cancel':ui.pendingImport=null;render();break;
    case 'clear-ask':ui.confirmClear=true;render();break;
    case 'clear-no':ui.confirmClear=false;render();break;
    case 'clear-yes':state.entries=[];ui.confirmClear=false;save();render();toast('Todos os registros foram apagados.');break;
  }
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='f')return; ev.preventDefault();
  var again=ev.submitter&&ev.submitter.id==='again'; saveForm(again);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.name==='fmode'){$('#f').classList.toggle('hide-count',t.value==='one');if(t.value==='total'&&$('#fc').value==='1')$('#fc').value='0';if(t.value==='one')$('#fc').value='1'}
  if(t.id==='impfile'&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){handleImportText(String(r.result))};r.onerror=function(){toast('Não consegui ler o arquivo.')};r.readAsText(t.files[0])}
  if(t.dataset&&t.dataset.set){
    var key=t.dataset.set,v=parseMoney(t.value),lim=key==='avg'?100000:9999999;
    if(isNaN(v)||v<=0||v>lim){toast('Valor inválido. Use números como 50 ou 7,50.');t.value=fmtInput(S[key]);return}
    S[key]=v;save();render();toast('Salvo.');
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&ui.sheet){ui.sheet.type==='form'&&ui.sheet.from==='day'?openSheet({type:'day',date:ui.sheet.date}):closeSheet()}
});
/* virada de dia com o app aberto */
var lastDay=TODAY();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&TODAY()!==lastDay){lastDay=TODAY();var n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.weekRef=lastDay;render()}});

load();render();
window.__meta50={state:function(){return state},render:render,ui:ui};
})();
</script>
